<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" role="img" aria-label="HostVexa — Hosting Management Platform">
  <defs>
    <linearGradient id="hv-grad-logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <!-- mark -->
  <g>
    <rect x="0" y="4" width="40" height="40" rx="10" fill="url(#hv-grad-logo)"/>
    <rect x="0" y="4" width="40" height="40" rx="10" fill="none" stroke="white" stroke-opacity="0.10" stroke-width="0.9"/>
    <g fill="white">
      <rect x="8.5" y="12.2" width="23" height="6.2" rx="1.9" fill-opacity="0.97"/>
      <circle cx="27.8" cy="15.3" r="1.05" fill="#0F172A" fill-opacity="0.14"/>
      <circle cx="27.8" cy="15.3" r="0.62" fill="white"/>
      <rect x="8.5" y="20.9" width="23" height="6.2" rx="1.9" fill-opacity="0.97"/>
      <circle cx="27.8" cy="24.0" r="1.05" fill="#0F172A" fill-opacity="0.14"/>
      <circle cx="27.8" cy="24.0" r="0.62" fill="white"/>
      <rect x="8.5" y="29.6" width="23" height="6.2" rx="1.9" fill-opacity="0.97"/>
      <circle cx="27.8" cy="32.7" r="1.05" fill="#0F172A" fill-opacity="0.14"/>
      <circle cx="27.8" cy="32.7" r="0.62" fill="#10B981"/>
    </g>
  </g>
  <!-- wordmark: Host (navy, semibold) + Vexa (gradient via solid accent fallback) -->
  <g font-family="'Instrument Sans', Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="52" y="30.5" font-size="22" font-weight="700" letter-spacing="-0.03em" fill="#0F172A">Host<tspan font-weight="600" fill="#0EA5E9">Vexa</tspan></text>
    <text x="52.2" y="39.2" font-size="7.2" font-weight="500" letter-spacing="0.14em" fill="#64748B">HOSTING MANAGEMENT</text>
  </g>
</svg>
