name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite, pdo_sqlite, mbstring, bcmath
          coverage: none
          ini-values: memory_limit=512M
      - run: composer install --no-interaction --prefer-dist
      - name: Unit + Feature tests
        run: php -d memory_limit=512M artisan test
      - name: Seeder integrity gate (sqlite:memory, fast)
        # Catches missing permissions / stale seeder inventory and non-idempotent seeders
        # before they reach production - see SeederIntegrityTest.php and scripts/seed-smoke.sh
        run: php -d memory_limit=512M artisan test --filter SeederIntegrityTest
      - name: Scratch DB smoke (migrate:fresh --seed on disposable sqlite)
        # Full migrate:fresh --seed on a scratch sqlite file - exercises the exact
        # path that wipes prod if seeders are not idempotent. See scripts/seed-smoke.sh
        run: bash scripts/seed-smoke.sh
